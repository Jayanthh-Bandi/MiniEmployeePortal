name: Backend CI

on:
  push:
    branches:
      - main
 
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET version
        run: dotnet --version

      - name: Restore backend dependencies
        run: dotnet restore backend/MiniEmployeePortal/MiniEmployeePortal.csproj

      - name: Build backend
        run: dotnet build backend/MiniEmployeePortal/MiniEmployeePortal.csproj --no-restore --configuration Release